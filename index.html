  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #EEF0F2;
    --surface: #FFFFFF;
    --surface-2: #F5F6F7;
    --navy: #203660;
    --navy-deep: #16264A;
    --text: #14213B;
    --text-muted: #6C7075;
    --border: #D6D9DC;
    --gold: #B8791F;
    --gold-soft: #F1E2C4;
    --rust: #A8482A;
    --rust-soft: #F3DED6;
    --teal: #2E6B58;
    --teal-soft: #D9EAE3;
    --slate: #365E80;
    --slate-soft: #DCE7EF;
    --cell-empty: #E3E5E7;
    --pay-green: #1F8A55;
    --cutoff-red: #B33A2E;
    --warn-amber: #C88A1F;
    --brand-grey: #BCBFC4;
    --brand-blue: #296298;
    --brand-lightblue: #3D8FBF;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B141F;
      --surface: #121E2B;
      --surface-2: #17232F;
      --navy: #274B6D;
      --navy-deep: #0B1E33;
      --text: #E7ECF1;
      --text-muted: #94A6B6;
      --border: #26343F;
      --gold: #E0A83D;
      --gold-soft: #3A3020;
      --rust: #E2795A;
      --rust-soft: #3A2721;
      --teal: #6BB79E;
      --teal-soft: #1E3830;
      --slate: #7FA6C9;
      --slate-soft: #1E2E3D;
      --cell-empty: #1B2733;
      --pay-green: #4CBB83;
      --cutoff-red: #E2624F;
      --warn-amber: #E0A83D;
      --brand-grey: #8B9096;
      --brand-blue: #4C86BF;
      --brand-lightblue: #6BB0DE;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B141F;
    --surface: #121E2B;
    --surface-2: #17232F;
    --navy: #274B6D;
    --navy-deep: #0B1E33;
    --text: #E7ECF1;
    --text-muted: #94A6B6;
    --border: #26343F;
    --gold: #E0A83D;
    --gold-soft: #3A3020;
    --rust: #E2795A;
    --rust-soft: #3A2721;
    --teal: #6BB79E;
    --teal-soft: #1E3830;
    --slate: #7FA6C9;
    --slate-soft: #1E2E3D;
    --cell-empty: #1B2733;
    --pay-green: #4CBB83;
    --cutoff-red: #E2624F;
    --warn-amber: #E0A83D;
    --brand-grey: #8B9096;
    --brand-blue: #4C86BF;
    --brand-lightblue: #6BB0DE;
  }

  * { box-sizing: border-box; }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 24px;
    text-align: center;
  }

  .brand-lockup {
    display: block;
    height: 90px;
    width: auto;
    margin-bottom: 4px;
  }

  .brand-tagline {
    font-family: 'Poppins', sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .brand-line {
    width: 260px;
    max-width: 70%;
    height: 4px;
    border-radius: 2px;
    margin: 10px 0 4px;
    background: linear-gradient(to right,
      var(--navy) 0%, var(--navy) 20%,
      var(--brand-blue) 20%, var(--brand-blue) 40%,
      var(--brand-lightblue) 40%, var(--brand-lightblue) 60%,
      var(--text-muted) 60%, var(--text-muted) 80%,
      var(--brand-grey) 80%, var(--brand-grey) 100%);
  }

  .brand-line.small { width: 140px; height: 3px; margin: 6px 0 0; }

  header.page h1 {
    font-family: 'URW Geometric', 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }

  header.page .today {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* HERO */
  .hero {
    background: linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius: 20px;
    padding: 28px 26px 26px;
    color: #F4F7FA;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(11, 30, 51, 0.5);
  }

  .hero::before {
    content: "";
    position: absolute;
    top: -60%;
    right: -20%;
    width: 60%;
    height: 220%;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }

  .ring-wrap {
    position: relative;
    width: 176px;
    height: 176px;
    flex: none;
    margin-bottom: 6px;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-track { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 12; }
  .ring-progress { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }

  .ring-pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: #fff;
  }

  .hero-info { min-width: 0; display: flex; flex-direction: column; align-items: center; }

  .hero-eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  .hero-tag.payroll { background: var(--gold-soft); color: #6B4A0E; }
  .hero-tag.overtime { background: var(--rust-soft); color: #7A2E17; }
  .hero-tag.expCutoff { background: var(--slate-soft); color: #1E3A54; }
  .hero-tag.expPayment { background: var(--teal-soft); color: #1B4636; }

  .hero-date-label {
    font-size: 0.85rem;
    color: rgba(244,247,250,0.7);
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 8px 0 6px;
    flex-wrap: wrap;
  }

  .countdown .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }

  .countdown .unit .num {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 2.3rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .countdown .unit .lbl {
    font-size: 0.68rem;
    color: rgba(244,247,250,0.6);
    margin-top: 6px;
    text-transform: lowercase;
  }

  .hero-sub {
    margin-top: 12px;
    font-size: 0.88rem;
    color: rgba(244,247,250,0.85);
    text-align: center;
  }

  .hero-sub strong { color: #fff; font-weight: 600; }

  /* LEGEND */
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }

  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .legend-chip .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }

  /* SECTION HEADS */
  .section-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 2px;
    margin: 30px 0 12px;
  }

  .section-head h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }

  .section-head .hint {
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  /* YEAR HEATMAP */
  .heatmap-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 16px 14px;
    overflow-x: auto;
  }

  .heat-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 2.5px 6px;
    border-radius: 6px;
  }

  .heat-row.current-month {
    background: rgba(46, 139, 87, 0.12);
    background: color-mix(in srgb, var(--pay-green) 14%, transparent);
  }

  .heat-row.current-month .mlabel {
    color: var(--text);
    font-weight: 700;
  }

  .heat-row .mlabel {
    width: 30px;
    flex: none;
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
  }

  .heat-cells {
    display: flex;
    gap: 2px;
  }

  .heat-cell {
    width: 7px;
    height: 15px;
    border-radius: 2px;
    background: var(--cell-empty);
    flex: none;
  }

  .heat-cell.today-cell { box-shadow: 0 0 0 1px var(--text) inset; }

  /* MONTH CALENDAR */
  .cal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 16px 14px;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .cal-nav .cal-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
  }

  .cal-nav button {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    line-height: 1;
  }
  .cal-nav button:disabled { opacity: 0.35; cursor: default; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-dow {
    text-align: center;
    font-size: 0.66rem;
    color: var(--text-muted);
    padding-bottom: 4px;
  }

  .cal-cell {
    aspect-ratio: 1;
    border-radius: 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 0.78rem;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    cursor: default;
    position: relative;
  }

  .cal-cell.pad { visibility: hidden; }
  .cal-cell.has-events { cursor: pointer; background: var(--surface-2); }
  .cal-cell.has-events:hover { border-color: var(--border); }
  .cal-cell.is-today { border-color: var(--text); }
  .cal-cell.selected { background: var(--navy); color: #fff; }

  .cal-dots {
    display: flex;
    gap: 2px;
  }

  .cal-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .cal-detail {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .cal-detail {
    text-align: center;
  }

  .cal-detail .cd-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 4px;
    color: var(--text);
  }

  .cal-detail .cd-item .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }

  /* TABS */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 28px;
    max-width: 560px;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 9px 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .tab .tab-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: var(--dot);
  }

  .tab:hover { border-color: var(--dot); }

  .tab.active {
    background: var(--dot);
    border-color: var(--dot);
    color: #fff;
  }

  .tab.active .tab-dot { background: #fff; }

  /* TIMELINE */
  .timeline {
    max-width: 420px;
    margin: 0 auto;
  }

  .item {
    position: relative;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
  }

  .item:last-child { border-bottom: none; }

  .item-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  .item-date {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
  }

  .item-cat {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .item-cat .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }

  .item-right {
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .item-right .soon { color: var(--rust); }

  .empty {
    padding: 30px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .brand-lockup {
  width: min(350px, 90vw);
  height: auto;
}
  
  .brand-lockup img, 
  .brand-lockup svg {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Prevents distortion, fits nicely inside the box */
  }
}
</style>
</head>

  function hexToRgb(hex) {
    hex = hex.replace('#', '').trim();
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  function blendRgb(c1, c2, t) {
    t = Math.min(1, Math.max(0, t));
    return c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
  }

  function rampColor(stops, t) {
    t = Math.min(1, Math.max(0, t));
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (t >= a.t && t <= b.t) {
        const local = (t - a.t) / ((b.t - a.t) || 1);
        return blendRgb(hexToRgb(resolveColor(a.c)), hexToRgb(resolveColor(b.c)), local);
      }
    }
    return hexToRgb(resolveColor(stops[stops.length - 1].c));
  }

    ev('2026-10-23T00:00:00', 'expPayment'),
    ev('2026-11-13T00:00:00', 'expPayment'),
    ev('2026-11-27T00:00:00', 'expPayment'),
    ev('2026-12-11T00:00:00', 'expPayment'),
    ev('2027-01-08T00:00:00', 'expPayment'),
  ].sort((a, b) => a.date - b.date);

  const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const monthFmt = new Intl.DateTimeFormat('en-GB', { month: 'short' });
  const monthYearFmt = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });

  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

  // Map of date-key -> array of category keys
  const eventsByDay = new Map();
  EVENTS.forEach(e => {
    const k = keyOf(e.date);
    if (!eventsByDay.has(k)) eventsByDay.set(k, []);
    eventsByDay.get(k).push(e.cat);
  });

  function pickDefaultCat() {
    const now = new Date();
    const next = EVENTS.find(e => e.date > now);
    return next ? next.cat : CAT_ORDER[0];
  }

  let activeCat = pickDefaultCat();
  let heroEvent = null;
  let prevEventDate = null;

  function upcoming(cat) {
    const now = new Date();
    return EVENTS.filter(e => e.date > now && e.cat === cat);
  }

  function relTime(days) {
    if (days === 0) return 'today';
    if (days === 1) return 'tomorrow';
    if (days < 7) return days + ' days';
    const w = Math.round(days / 7);
    return w === 1 ? '1 week' : w + ' weeks';
  }

  /* ---------- LEGEND ---------- */
  function renderLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = CAT_ORDER.map(k => {
      const c = CATS[k];
      return `<span class="legend-chip"><span class="swatch" style="background:${c.color}"></span>${c.label}</span>`;
    }).join('');
  }

  /* ---------- TABS ---------- */
  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    CAT_ORDER.forEach(key => {
      const c = CATS[key];
      const btn = document.createElement('button');
      btn.className = 'tab' + (key === activeCat ? ' active' : '');
      btn.style.setProperty('--dot', resolveColor(c.color));
      btn.innerHTML = `<span class="tab-dot"></span>${c.label}`;
      btn.addEventListener('click', () => { activeCat = key; renderTabs(); renderTimeline(); updateHero(); });
      tabs.appendChild(btn);
    });
  }

  /* ---------- TIMELINE ---------- */
  function renderTimeline() {
    const list = upcoming(activeCat).slice(0, 14);
    const el = document.getElementById('timeline');
    el.innerHTML = '';
    if (list.length === 0) {
      el.innerHTML = '<div class="empty">No more dates in this category for the period shown.</div>';
      return;
    }
    const now = new Date();
    list.forEach(e => {
      const info = CATS[e.cat];
      const days = Math.floor((e.date - now) / 86400000);
      const item = document.createElement('div');
      item.className = 'item';
      item.style.setProperty('--dot-color', info.color);
      item.innerHTML = `
        <div class="item-left">
          <span class="item-date">${dateFmt.format(e.date)}</span>
          <span class="item-cat"><span class="dot" style="background:${info.color}"></span>${info.label}</span>
        </div>
        <div class="item-right">${days <= 3 ? `<span class="soon">${relTime(days)}</span>` : relTime(days)}</div>
      `;
      el.appendChild(item);
    });
  }

  /* ---------- HERO + RING ---------- */
  const RING_R = 76;
  const RING_C = 2 * Math.PI * RING_R;
  document.getElementById('ringProgress').style.strokeDasharray = RING_C.toFixed(2);

  function updateHero() {
    const list = upcoming(activeCat);
    heroEvent = list[0] || null;

    const tagEl = document.getElementById('heroTag');
    const dateLabelEl = document.getElementById('heroDateLabel');
    const subEl = document.getElementById('heroSub');
    const ringProgress = document.getElementById('ringProgress');
    const ringPct = document.getElementById('ringPct');

    if (!heroEvent) {
      tagEl.textContent = 'All clear';
      tagEl.className = 'hero-tag';
      dateLabelEl.textContent = 'No upcoming dates in this category';
      subEl.textContent = '';
      ['d','h','m','s'].forEach(id => document.getElementById(id).textContent = '00');
      ringProgress.style.strokeDashoffset = RING_C;
      ringPct.textContent = '–';
      prevEventDate = null;
      return;
    }

    const info = CATS[heroEvent.cat];
    tagEl.textContent = info.label;
    tagEl.className = 'hero-tag ' + info.tagClass;
    dateLabelEl.textContent = dateFmt.format(heroEvent.date);
    ringProgress.style.stroke = resolveColor(info.color);

    if (heroEvent.cat === 'expCutoff') {
      subEl.innerHTML = `Entries close at <strong>12:00pm</strong> on this date.`;
    } else {
      subEl.innerHTML = `This is the next <strong>${info.label.toLowerCase()}</strong> on the calendar.`;
    }

    // reference point for the ring: the previous occurrence of this same category
    // (e.g. last month's payroll payment), so progress reflects the cycle for
    // whichever calendar is selected rather than an unrelated category's date
    const sameCat = EVENTS.filter(e => e.cat === heroEvent.cat);
    const idx = sameCat.indexOf(heroEvent);
    prevEventDate = idx > 0 ? sameCat[idx - 1].date : new Date(heroEvent.date.getTime() - 30 * 86400000);
  }

  function tick() {
    document.getElementById('todayLabel').textContent = dateFmt.format(new Date());
    if (!heroEvent) return;
    const now = new Date();
    let diff = heroEvent.date - now;
    if (diff <= 0) {
      updateHero();
      renderTimeline();
      renderHeatmap();
      renderCalendar();
      return;
    }
    const d = Math.floor(diff / 86400000); diff -= d * 86400000;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000); diff -= m * 60000;
    const s = Math.floor(diff / 1000);
    document.getElementById('d').textContent = pad(d);
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(s);

    if (prevEventDate) {
      const total = heroEvent.date - prevEventDate;
      const elapsed = now - prevEventDate;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      const offset = RING_C * (1 - pct / 100);
      const ringProgress = document.getElementById('ringProgress');
      ringProgress.style.strokeDashoffset = offset.toFixed(2);
      document.getElementById('ringPct').textContent = Math.round(pct) + '%';

      const ramp = CAT_RAMPS[heroEvent.cat];
      const [r, g, b] = rampColor(ramp, pct / 100);
      ringProgress.style.stroke = `rgb(${r}, ${g}, ${b})`;
    }
  }

  /* ---------- YEAR HEATMAP ---------- */
  function resolveColor(varStr) {
    return getComputedStyle(document.documentElement).getPropertyValue(varStr.match(/--[a-z-]+/)[0]).trim();
  }

  function renderHeatmap() {
    const el = document.getElementById('heatmap');
    const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
    const todayKey = keyOf(new Date());
    const nowDate = new Date();
    const currentMonthIdx = nowDate.getFullYear() === 2026 ? nowDate.getMonth() : -1;
    let html = '';
    for (let m = 0; m < 12; m++) {
      const rowClass = 'heat-row' + (m === currentMonthIdx ? ' current-month' : '');
      html += `<div class="${rowClass}"><span class="mlabel">${monthFmt.format(new Date(2026, m, 1))}</span><div class="heat-cells">`;
      for (let d = 1; d <= daysInMonth[m]; d++) {
        const k = `2026-${pad(m + 1)}-${pad(d)}`;
        const cats = eventsByDay.get(k);
        let bg = 'var(--cell-empty)';
        let title = `${d} ${monthFmt.format(new Date(2026, m, 1))}`;
        if (cats && cats.length) {
          if (cats.length === 1) {
            bg = CATS[cats[0]].color;
          } else {
            const c1 = resolveColor(CATS[cats[0]].color);
            const c2 = resolveColor(CATS[cats[1]].color);
            bg = `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)`;
          }
          title += ': ' + cats.map(c => CATS[c].label).join(', ');
        }
        const isToday = k === todayKey ? ' today-cell' : '';
        html += `<div class="heat-cell${isToday}" style="background:${bg}" title="${title}"></div>`;
      }
      html += `</div></div>`;
    }
    el.innerHTML = html;
  }

  /* ---------- MONTH CALENDAR ---------- */
  const CAL_MIN = new Date(2026, 0, 1);
  const CAL_MAX = new Date(2027, 0, 1);
  let calCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  if (calCursor < CAL_MIN) calCursor = new Date(CAL_MIN);
  if (calCursor > CAL_MAX) calCursor = new Date(CAL_MAX);
  let selectedKey = null;

  function renderCalendar() {
    document.getElementById('calTitle').textContent = monthYearFmt.format(calCursor);
    document.getElementById('calPrev').disabled = calCursor <= CAL_MIN;
    document.getElementById('calNext').disabled = calCursor >= CAL_MAX;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['M','T','W','T','F','S','S'].forEach(d => {
      const dow = document.createElement('div');
      dow.className = 'cal-dow';
      dow.textContent = d;
      grid.appendChild(dow);
    });

    const year = calCursor.getFullYear(), month = calCursor.getMonth();
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayKey = keyOf(new Date());

    for (let i = 0; i < firstDow; i++) {
      const pad_ = document.createElement('div');
      pad_.className = 'cal-cell pad';
      grid.appendChild(pad_);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const k = `${year}-${pad(month + 1)}-${pad(d)}`;
      const cats = eventsByDay.get(k);
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (cats ? ' has-events' : '') + (k === todayKey ? ' is-today' : '') + (k === selectedKey ? ' selected' : '');
      cell.innerHTML = `<span>${d}</span>` + (cats ? `<div class="cal-dots">${cats.map(c => `<span style="background:${k===selectedKey? '#fff' : CATS[c].color}"></span>`).join('')}</div>` : '');
      if (cats) {
        cell.addEventListener('click', () => { selectedKey = (selectedKey === k) ? null : k; renderCalendar(); });
      }
      grid.appendChild(cell);
    }

    const detail = document.getElementById('calDetail');
    if (selectedKey && eventsByDay.get(selectedKey)) {
      const [yy, mm, dd] = selectedKey.split('-').map(Number);
      const d = new Date(yy, mm - 1, dd);
      detail.style.display = 'block';
      detail.innerHTML = `<strong style="color:var(--text)">${dateFmt.format(d)}</strong>` +
        eventsByDay.get(selectedKey).map(c => `<div class="cd-item"><span class="dot" style="background:${CATS[c].color}"></span>${CATS[c].label}</div>`).join('');
    } else {
      detail.style.display = 'none';
      detail.innerHTML = '';
    }
  }

  document.getElementById('calPrev').addEventListener('click', () => {
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1);
    selectedKey = null;
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1);
    selectedKey = null;
    renderCalendar();
  });

  renderLegend();
  renderTabs();
  updateHero();
  renderTimeline();
  renderHeatmap();
  renderCalendar();
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
